[package]
name = "m6980x-gui"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true

[[bin]]
name = "m6980x_configtool_gui"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36.2", features = ["persistence"] }
egui-phosphor = "0.14.0"
m6980x-core = { version = "2.4.1", path = "../m6980x-core", features = ["fake"] }
image = { version = "0.25.10", default-features = false, features = ["webp"] }
rfd = "0.17.2"
serde_json = "1.0.154"
