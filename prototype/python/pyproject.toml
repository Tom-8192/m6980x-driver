[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "m6980x-configtool"
version = "1.1.0"
description = "M6980X Configuration Tool: unofficial configuration tool for the Gigabyte GHOST M6980X mouse (Windows and Linux)"
requires-python = ">=3.9"
# Linux uses /dev/hidraw directly and needs no hidapi
dependencies = ["hidapi>=0.14; sys_platform != 'linux'"]

[project.scripts]
m6980x-configtool = "m6980x_configtool.cli:main"

[tool.setuptools]
packages = ["m6980x_configtool"]
