[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "m6980x-configtool"
version = "1.1.0"
description = "M6980X Configuration Tool: inoffizielles Konfigurationstool fuer die Gigabyte GHOST M6980X (Windows und Linux)"
requires-python = ">=3.9"
# Linux nutzt /dev/hidraw direkt und braucht kein hidapi
dependencies = ["hidapi>=0.14; sys_platform != 'linux'"]

[project.scripts]
m6980x-configtool = "m6980x_configtool.cli:main"

[tool.setuptools]
packages = ["m6980x_configtool"]
