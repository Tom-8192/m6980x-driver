name: Release

# Ein Tag wie v2.0.1 baut, testet und veroeffentlicht ein Release mit den fertigen Programmen.
# Release-Notizen: docs/releases/<tag>.md (falls vorhanden), sonst von GitHub erzeugt.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: ubuntu-latest
            target: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Tag passt zur Version in Cargo.toml
        shell: bash
        run: grep -q "^version = \"${GITHUB_REF_NAME#v}\"" Cargo.toml || { echo "Tag $GITHUB_REF_NAME passt nicht zu Cargo.toml"; exit 1; }
      - name: Linux-Pakete fuer die Oberflaeche
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - run: cargo build --release --workspace
      - name: Paket schnueren
        shell: bash
        run: |
          DIR="m6980x-configtool-${GITHUB_REF_NAME#v}-${{ matrix.target }}"
          mkdir "$DIR"
          cp README.md README.de.md LICENSE "$DIR/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/m6980x_configtool.exe target/release/m6980x_configtool_gui.exe "$DIR/"
            7z a "$DIR.zip" "$DIR"
          else
            cp target/release/m6980x_configtool target/release/m6980x_configtool_gui linux/70-m6980x-configtool.rules "$DIR/"
            tar czf "$DIR.tar.gz" "$DIR"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            m6980x-configtool-*.zip
            m6980x-configtool-*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release veroeffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="docs/releases/$GITHUB_REF_NAME.md"
          if [ -f "$NOTES" ]; then ARGS=(--notes-file "$NOTES"); else ARGS=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" dist/* --title "M6980X Configuration Tool $GITHUB_REF_NAME" "${ARGS[@]}"
