name: CI

on:
  push:
    branches: ["**"]   # Tags baut der Release-Workflow
  pull_request:

# ein neuer Push bricht den noch laufenden Lauf desselben Branches ab
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Linux-Pakete fuer die Oberflaeche
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release --workspace
      - uses: actions/upload-artifact@v4
        with:
          name: m6980x-configtool-${{ runner.os }}
          if-no-files-found: ignore
          path: |
            target/release/m6980x_configtool
            target/release/m6980x_configtool_gui
            target/release/m6980x_configtool.exe
            target/release/m6980x_configtool_gui.exe

  prototype:
    # Python-Prototyp: eigene Tests, und die Paritaets-Fixtures muessen zu ihm passen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests
        working-directory: prototype/python
      - run: python prototype/python/tools/export_fixtures.py && git diff --exit-code tests/fixtures
